            <p>

            </p>

        <form action="mailto:info@novalink.com"
              method="post"
              enctype="text/plain">

            <label for="name">Name:</label>
            <br>

            <input type="text"
                   id="name"
                   name="name"
                   required>

            <br><br>


            <label for="email">Email:</label>
            <br>

            <input type="email"
                   id="email"
                   name="email"
                   required>

            <br><br>


            <label for="subject">Subject:</label>
            <br>

            <input type="text"
                   id="subject"
                   name="subject"
                   required>

            <br><br>


            <label for="phone">Phone Number:</label>
            <br>

            <input type="tel"
                   id="phone"
                   name="phone">

            <br><br>


            <label for="message">Message:</label>
            <br>

            <textarea id="message"
                      name="message"
                      rows="6"
                      cols="40"
                      required></textarea>

            <br><br>

            <input type="submit"
                   value="Submit">

        </form>
